packages:
  - 'packages/*'
  - 'tools/*'
  - 'test'
  - 'templates/blank'
  - 'templates/website'
  - 'templates/ecommerce'

catalog:
  copyfiles: '2.4.1'
  cross-env: '7.0.3'
  dotenv: '16.4.7'
  react: '19.2.6'
  react-dom: '19.2.6'
  typescript: '5.7.3'

updateNotifier: false
symlink: true
nodeLinker: isolated
hoistWorkspacePackages: false # the default in pnpm v9 is true, but that can break our runtime dependency checks
savePrefix: ''
# pnpm v11 defaults this to `install`, which auto-reinstalls when node_modules looks
# stale before any `pnpm run`/`pnpm exec`. The root `prepare` script nests `pnpm turbo`
# inside the outer install's lifecycle, so that check deadlocks against the in-flight
# install (CI hangs until SIGTERM). Restore the v10 behavior.
# See https://github.com/pnpm/pnpm/issues/8865
verifyDepsBeforeRun: false

overrides:
  '@hono/node-server@<2.0.5': '>=2.0.5' # GHSA-frvp-7c67-39w9: no patched 1.x exists
  '@types/request>form-data': '^2.5.6'
  'amazon-cognito-identity-js>js-cookie': '^3.0.7'
  copyfiles: 'catalog:'
  cross-env: 'catalog:'
  dotenv: 'catalog:'
  graphql: '16.8.1'
  'mcp-handler>@modelcontextprotocol/sdk': '1.30.0'
  react: 'catalog:'
  react-dom: 'catalog:'
  typescript: 'catalog:'

# Replaces pnpm v10 `onlyBuiltDependencies`: packages permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  # (로컬 보정 2026-08-17) Payload 개발자용 git 커밋 훅을 심볼릭 링크로 걸려 하는데,
  # Windows에서 관리자 권한 없이는 EPERM 으로 막혀 install 전체가 exit 1 로 끝난다.
  # 우리는 upstream에 기여하지 않으므로 이 훅이 필요 없다. 되돌리려면 true 로 바꾼다.
  '@vercel/git-hooks': false
  # (로컬 보정 2026-08-17) SQLite 어댑터용 네이티브 모듈. 컴파일에 Visual Studio C++
  # 빌드 도구가 필요한데 없어서 gyp 가 실패한다. 우리는 MongoDB 로 가므로 쓰지 않는다.
  # SQLite 로 갈아탈 일이 생기면 빌드 도구를 깐 뒤 true 로 바꾼다.
  better-sqlite3: false
  bufferutil: true
  esbuild: true
  # (로컬 보정 2026-08-17) 테스트용 인메모리 MongoDB. 설치 시 591MB 를 내려받는다.
  # 우리는 Docker 로 실제 MongoDB 를 띄우므로 필요 없다.
  mongodb-memory-server: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
